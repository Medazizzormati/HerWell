services:
  - type: web
    name: herwell-ai-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    branch: main
    healthCheckPath: /health
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: herwell-db
          property: connectionString
      - key: LLM_BASE_URL
        value: https://herwell-llama-service.onrender.com
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: LLM_PROVIDER
        value: llamacpp
      - key: LLM_MODEL
        value: llama-3.2-3b-instruct
      - key: LLM_TIMEOUT
        value: 120
      - key: LLM_MAX_TOKENS
        value: 800
      - key: CORS_ORIGINS
        value: https://herwell-backend.onrender.com,https://herwell-frontend.onrender.com
      - key: PORT
        value: 8000
