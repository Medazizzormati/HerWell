# Server Configuration
server.port=${PORT:8080}
spring.application.name=herwell-backend

# Database Configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/herwell}
spring.datasource.username=${DB_USERNAME:herwell}
spring.datasource.password=${DB_PASSWORD:herwell_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176}

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout=${AI_SERVICE_TIMEOUT:30000}

# JWT Configuration
jwt.secret=${JWT_SECRET:herwell-secret-key-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.tn.herwell=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
